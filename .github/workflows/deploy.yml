name: Ultra Fast Deploy Mutant Workstation to cPanel

# Vercel is now the primary deployment target (auto-deploys on push via its own
# GitHub integration, no workflow needed here for that). This cPanel pipeline is
# kept as a manual-only fallback — trigger it from the Actions tab if ever needed.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Database
        run: |
          npx prisma generate
          npx prisma db push
          npx prisma db seed

      - name: Package cPanel Standalone Build
        run: |
          chmod +x package-cpanel.sh
          ./package-cpanel.sh

      - name: Deploy Zip Bundle via SCP / SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          source: 'cpanel-mutant-workstation.zip'
          target: 'workstation.mutanttechnologies.com'

      - name: Extract Zip, Clear Stuck Processes & Restart on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ~/workstation.mutanttechnologies.com

            echo "📊 Process count before cleanup: $(ps -u "$(whoami)" | wc -l)"

            # Kill any stuck/zombie instances of THIS app specifically (never a blanket
            # node kill — other apps may share the account). Ignore if none are running.
            pkill -9 -f "workstation.mutanttechnologies.com/app.js" 2>/dev/null || true
            sleep 1

            unzip -o cpanel-mutant-workstation.zip
            mkdir -p tmp
            touch tmp/restart.txt

            echo "📊 Process count after cleanup: $(ps -u "$(whoami)" | wc -l)"
            echo "🚀 Deployment & Server Restart Complete!"

      - name: Health Check
        run: |
          echo "Waiting for Passenger to boot the new build..."
          for i in $(seq 1 10); do
            sleep 6
            code=$(curl -s -o /dev/null -w "%{http_code}" https://workstation.mutanttechnologies.com/login || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "✅ Site is up."
              exit 0
            fi
          done
          echo "❌ Site did not come up healthy after deploy. Check cPanel Node.js App logs."
          exit 1
